[package]
name = "rusty_esp_core"
description = "Shared no_std types for the Janus ESP family: borrowed media frames, PCM blocks, monotonic timestamps, a signed-capability manifest, and the three HAL seams (clock, rng, kv). No drivers, no allocator, no product types. forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_esp_core"
keywords = ["esp32", "embedded", "no-std", "mata", "remade-with-rust"]
categories = ["embedded", "no-std", "no-std::no-alloc", "hardware-support"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal.
std = ["alloc"]
alloc = []

[dependencies]

[lints]
workspace = true
