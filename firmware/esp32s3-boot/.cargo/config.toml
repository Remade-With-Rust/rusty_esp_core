[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# xtensa-lx-rt's `link.x` includes this project's `memory.x` (build.rs puts
# the project root on the link search path).
# `-nostartfiles`: the gcc driver would otherwise add crti.o/crtn.o (six bytes of
# `_init`/`_fini` prologue) that nothing here calls.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-nostartfiles"]

[unstable]
build-std = ["core"]
